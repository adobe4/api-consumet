<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <title>FlowMap — your success system, alive</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23151517'/%3E%3Cpath d='M5 21c6-10 10 6 22-9' stroke='%23ff8a3d' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='27' cy='12' r='3' fill='%23ffc933'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/tactile.css">
  <link rel="stylesheet" href="/css/canvas.css">
  <link rel="stylesheet" href="/css/board.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <div id="boot" class="boot"><div class="boot-orb"></div><p>Waking up your system…</p></div>

  <section id="auth" class="auth" hidden></section>

  <div id="app" class="app" hidden>
    <header class="topbar" id="topbar"></header>
    <main class="main">
      <div class="stage" id="stage">
        <canvas id="map" aria-label="Living map of your projects"></canvas>
        <div class="stage-top" id="stage-top"></div>
        <div class="legend" id="legend"></div>
        <div class="zoom" id="zoom"></div>
        <div class="future-banner" id="future-banner" hidden></div>
        <div class="tip" id="tip" hidden></div>
        <div class="empty" id="empty" hidden></div>
      </div>
      <div class="boards-host" id="boards-host" hidden></div>
      <aside class="dock" id="dock">
        <nav class="tabs" id="tabs" role="tablist"></nav>
        <div class="panel" id="panel"></div>
      </aside>
    </main>
    <footer class="timeline" id="timeline"></footer>
    <button class="sheet-toggle" id="sheet-toggle" aria-label="Open panel">☰ Panel</button>
  </div>

  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
