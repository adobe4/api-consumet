<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlowMap</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d1c1a; color: #f3eee7; font: 16px/1.5 system-ui, sans-serif; }
  body { display: grid; place-items: center; text-align: center; padding: 24px; box-sizing: border-box; }
  .card { max-width: 340px; }
  .mark { width: 76px; height: 76px; margin: 0 auto 22px; border-radius: 22px; background: radial-gradient(circle at 50% 35%, #2a221c, #121113); box-shadow: 0 14px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06); display: grid; place-items: center; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { margin: 0 0 24px; color: #b9b0a5; }
  button { border: 0; border-radius: 999px; padding: 14px 26px; font: 700 16px system-ui, sans-serif; color: #1a0d04; background: linear-gradient(135deg, #ffb020, #ff6b2c); box-shadow: 0 10px 26px rgba(255,120,40,.35); }
  button:active { transform: scale(.97); }
</style>
</head>
<body>
  <div class="card">
    <div class="mark"><svg width="46" height="46" viewBox="0 0 32 32"><path d="M5 22c6-11 10 7 22-10" stroke="#ff8a3d" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="27" cy="12" r="3.2" fill="#ffc933"/><circle cx="5" cy="22" r="2.6" fill="#46e58a"/></svg></div>
    <h1>No internet right now</h1>
    <p>FlowMap needs the internet to load your boards and projects. Check your data or Wi-Fi, then try again.</p>
    <button type="button" onclick="window.FlowMapAndroid ? FlowMapAndroid.retry() : location.reload()">Try again</button>
  </div>
</body>
</html>
