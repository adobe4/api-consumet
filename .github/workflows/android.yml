name: Build Android APK

on:
  push:
    branches: ['claude/repo-clone-cleanup-46e552']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  android:
    name: Build release APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager "ndk;27.1.12297006" "cmake;3.22.1" >/dev/null 2>&1 || true

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # Build a RELEASE APK: the JS bundle is compiled into the APK, so the app
      # runs fully offline with no Metro dev server. The Expo/RN template signs
      # the release build type with the bundled debug keystore, so the APK is
      # installable out of the box (fine for a personal / sideloaded app).
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: autoreel-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
